name: article2video
description: AI-powered Text-to-Video Generation Platform
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.1
  
  # State management
  provider: ^6.1.2
  
  # UI & UX
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  
  # Video player
  video_player: ^2.8.3
  
  # File handling & download
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  
  # Utils
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
